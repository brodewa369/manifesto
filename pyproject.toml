[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "manifesto"
version = "0.2.0"
description = "Portable AI agent job contracts: a manifest schema, validator, discovery scanner, and exporters so any enforcer can consume it."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Brodewa"}]
keywords = ["agents", "manifest", "governance", "policy", "mcp", "validator", "interop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/brodewa369/manifesto"

[project.scripts]
manifesto = "manifesto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
